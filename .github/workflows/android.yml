name: Android

# Builds the sideloadable preview APK and renders review screenshots. Pushes to
# master (and manual runs) also publish the APK as a new release, tagged
# android-preview-<versionName> and marked latest, so this URL always serves the
# newest preview:
# https://github.com/orthodoxwest/office/releases/latest/download/office-preview.apk
#
# The repository has immutable releases on: a published release's tag can never
# be moved or reused, even after the release is deleted. So each preview gets a
# tag of its own rather than recreating one rolling tag; the fixed tag this
# workflow once reused, android-preview, is spent for good.
on:
  push:
    branches: [master]
    # The APK embeds the corpus, so a text fix on master is a new preview.
    paths:
      - "apps/android/**"
      - "apps/mobile-ffi/**"
      - "crates/**"
      - "data/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [master]
    paths:
      - "apps/android/**"
      - "apps/mobile-ffi/**"
      - "crates/render-blocks/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NDK_VERSION: 28.2.13676358

jobs:
  build:
    name: Build preview APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          # The version code counts commits, so the preview needs full history.
          fetch-depth: 0

      - name: Read the version
        id: version
        # The same versionName app/build.gradle.kts gives the APK.
        run: echo "version=0.1.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install the Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-36" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build the APK and render screenshots
        working-directory: apps/android
        run: ./gradlew --console=plain assemblePreview testDebugUnitTest

      - name: Name the APK
        run: cp apps/android/app/build/outputs/apk/preview/app-preview.apk office-preview.apk

      - uses: actions/upload-artifact@v7
        with:
          name: office-preview-apk
          path: office-preview.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-screenshots
          path: apps/android/app/build/screenshots/
          if-no-files-found: warn

  publish:
    name: Publish android-preview
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: office-preview-apk

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: android-preview-${{ needs.build.outputs.version }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # A re-run for a commit already published has nothing new to add, and
          # an immutable release could not be replaced anyway.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::$TAG is already published; nothing to do."
            exit 0
          fi
          gh release create "$TAG" office-preview.apk \
            --target "$GITHUB_SHA" \
            --latest \
            --title "Android preview $VERSION" \
            --notes "Sideload preview $VERSION, built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. On your phone, open this page, tap office-preview.apk, and allow the install. Updates install over earlier previews."

      - name: Prune older previews
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEP: 5
        run: |
          # Newest first; keep the last few so a bad preview can be stepped back from.
          gh release list --exclude-drafts --limit 100 --json tagName --jq '.[].tagName' \
            | { grep '^android-preview-' || true; } \
            | tail -n +$((KEEP + 1)) \
            | while read -r tag; do
                gh release delete "$tag" --cleanup-tag --yes \
                  || echo "::warning::Could not delete $tag"
              done
