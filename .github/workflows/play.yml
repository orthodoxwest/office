name: Publish to Play

# Builds the signed store bundle from master and uploads it to a Google Play track. Setup and the
# secrets it reads are in apps/android/README.md ("Publishing from CI").
#
# Every merge to master that changes the app goes to Internal testing and Closed testing (the
# `alpha` track) at once: Internal reaches the maintainers within minutes, unreviewed, so a bad build
# shows there first; Closed testing reaches testers once Google's review passes, and a newer merge
# replaces a release still in review.
# Those runs use the `play-internal` environment, with no reviewer, and skip quietly until
# PLAY_SERVICE_ACCOUNT_JSON is set. The public gets a build only when it is promoted in Play
# Console, or uploaded by a manual run from the Actions tab; manual runs use the `play`
# environment, so give it a required reviewer.
#
# Google's API can't create the app or take its very first bundle: upload one by hand in Play
# Console first (a manual run of the Android workflow builds it).
on:
  push:
    branches: [master]
    # What goes into the bundle, as in android.yml.
    paths:
      - "apps/android/**"
      - "apps/mobile-ffi/**"
      - "crates/**"
      - "data/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/play.yml"
      # Editing the notes alone uploads nothing; the next app change carries them.
      - "!apps/android/whatsnew.txt"
  workflow_dispatch:
    inputs:
      track:
        description: "Play track (alpha is Closed testing)"
        type: choice
        options: [internal, alpha, production]
        default: alpha
      rollout:
        description: "Share of users to roll out to, from 0 to 1 (below 1 is a staged rollout)"
        type: string
        default: "1"
      notes:
        description: "Release notes (what's new); empty uses apps/android/whatsnew.txt"
        type: string
        default: ""

# A merge waiting behind another replaces it, so the testing tracks get the newest build; a
# manual run has its own queue and is never replaced by a merge.
concurrency:
  group: play-${{ github.event_name }}
  cancel-in-progress: false

env:
  NDK_VERSION: 28.2.13676358

jobs:
  ready:
    name: Check for the Play credentials
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      play: ${{ steps.check.outputs.play }}
    steps:
      - id: check
        env:
          HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        run: echo "play=$HAS_PLAY" >> "$GITHUB_OUTPUT"

  publish:
    name: Build and upload to ${{ inputs.track || 'internal and closed testing' }}
    needs: ready
    # A manual run without the credentials still fails, at the upload, so the missing secret shows.
    if: github.event_name == 'workflow_dispatch' || needs.ready.outputs.play == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'play-internal' || 'play' }}
    permissions:
      contents: read
    env:
      # One upload, released on each comma-separated track in the same edit.
      TRACKS: ${{ inputs.track || 'internal,alpha' }}

    steps:
      - name: Release from master only
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::Publish from master, not ${GITHUB_REF}"
          exit 1

      - name: Check the rollout
        id: rollout
        env:
          ROLLOUT: ${{ inputs.rollout || '1' }}
        run: |
          if ! python3 -c 'import sys; f = float(sys.argv[1]); sys.exit(0 if 0 < f <= 1 else 1)' "$ROLLOUT"; then
            echo "::error::rollout must be a number above 0 and at most 1, not '$ROLLOUT'"
            exit 1
          fi
          if python3 -c 'import sys; sys.exit(0 if float(sys.argv[1]) < 1 else 1)' "$ROLLOUT"; then
            echo "status=inProgress" >> "$GITHUB_OUTPUT"
            echo "fraction=$ROLLOUT" >> "$GITHUB_OUTPUT"
          else
            echo "status=completed" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          # The version code counts commits, so the bundle needs full history.
          fetch-depth: 0

      # The notes are apps/android/whatsnew.txt as checked in (a manual run's input replaces it),
      # never anything taken from the merge. Empty means no notes. Checked before the build, so
      # a text Play would refuse stops the run early.
      - name: Write the release notes
        id: notes
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          if [ -z "$NOTES" ]; then
            NOTES=$(grep -v '^#' apps/android/whatsnew.txt | sed '/./,$!d')
          fi
          if [ -n "$NOTES" ]; then
            LENGTH=$(printf '%s' "$NOTES" | python3 -c 'import sys; print(len(sys.stdin.read()))')
            if [ "$LENGTH" -gt 500 ]; then
              echo "::error::Release notes are $LENGTH characters; Play takes at most 500"
              exit 1
            fi
            mkdir -p "$RUNNER_TEMP/whatsnew"
            printf '%s\n' "$NOTES" > "$RUNNER_TEMP/whatsnew/whatsnew-en-US"
            echo "dir=$RUNNER_TEMP/whatsnew" >> "$GITHUB_OUTPUT"
            echo "Release notes:"; cat "$RUNNER_TEMP/whatsnew/whatsnew-en-US"
          else
            echo "No release notes"
          fi

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install the Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-36" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the store bundle
        working-directory: apps/android
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          OFFICE_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          OFFICE_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          export OFFICE_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks"
          trap 'rm -f "$OFFICE_UPLOAD_KEYSTORE"' EXIT
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$OFFICE_UPLOAD_KEYSTORE"
          ./gradlew --console=plain bundleRelease

      - name: Upload to Google Play
        if: steps.rollout.outputs.status == 'completed'
        # v1.1.5, pinned by commit.
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.orthodoxwest.office
          releaseFiles: apps/android/app/build/outputs/bundle/release/app-release.aab
          mappingFile: apps/android/app/build/outputs/mapping/release/mapping.txt
          tracks: ${{ env.TRACKS }}
          status: completed
          whatsNewDirectory: ${{ steps.notes.outputs.dir }}

      - name: Upload to Google Play (staged rollout)
        if: steps.rollout.outputs.status == 'inProgress'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.orthodoxwest.office
          releaseFiles: apps/android/app/build/outputs/bundle/release/app-release.aab
          mappingFile: apps/android/app/build/outputs/mapping/release/mapping.txt
          tracks: ${{ env.TRACKS }}
          status: inProgress
          userFraction: ${{ steps.rollout.outputs.fraction }}
          whatsNewDirectory: ${{ steps.notes.outputs.dir }}

      - uses: actions/upload-artifact@v7
        with:
          name: office-release-aab
          path: apps/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
