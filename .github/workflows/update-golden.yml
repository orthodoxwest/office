name: Update golden files

on:
  # Unlike pull_request, this fires even when the PR has merge conflicts.
  pull_request_target:
    types: [labeled]

concurrency:
  group: update-golden-${{ github.event.pull_request.number }}
  cancel-in-progress: false

# The PR head stays pinned to the labeled revision. The base is resolved below:
# a conflicted PR's event can retain an old base.sha even after master advances.
env:
  HEAD_REF: ${{ github.event.pull_request.head.ref }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  BASE_REF: ${{ github.event.pull_request.base.ref }}

jobs:
  generate:
    name: Merge base and regenerate goldens
    if: >-
      github.event.label.name == 'update-golden' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.authorize.outputs.base_sha }}
    defaults:
      run:
        working-directory: pr

    steps:
      - name: Authorize update and pin the current base
        id: authorize
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo,
              username: context.actor,
            });
            if (context.actor === 'github-actions[bot]' ||
                !['admin', 'maintain', 'write'].includes(data.permission)) {
              core.setFailed('The update-golden label must be added by a collaborator with write access.');
              return;
            }
            const { data: base } = await github.rest.git.getRef({
              ...context.repo,
              ref: `heads/${context.payload.pull_request.base.ref}`,
            });
            core.setOutput('base_sha', base.object.sha);

      # Load the helper from the workflow revision, outside the PR checkout.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow
          sparse-checkout: scripts/update_golden.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: pr/go.mod
          cache: false

      - name: Merge the base branch
        env:
          BASE_SHA: ${{ steps.authorize.outputs.base_sha }}
        run: python3 "$GITHUB_WORKSPACE/workflow/scripts/update_golden.py" merge

      - name: Regenerate and verify
        run: |
          make golden
          go test ./...
          make validate

      - uses: actions/upload-artifact@v4
        with:
          name: golden-candidates
          path: pr/internal/e2e/testdata/golden/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish and report golden update
    needs: generate
    if: >-
      always() &&
      github.event.label.name == 'update-golden' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      # This job executes only the trusted helper, never the PR's scripts.
      - uses: actions/checkout@v4
        if: needs.generate.result == 'success'
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow
          sparse-checkout: scripts/update_golden.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/checkout@v4
        if: needs.generate.result == 'success'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        if: needs.generate.result == 'success'
        with:
          name: golden-candidates
          path: ${{ runner.temp }}/golden-candidates

      - name: Apply goldens and push
        id: push
        if: needs.generate.result == 'success'
        working-directory: pr
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/golden-candidates
          BASE_SHA: ${{ needs.generate.outputs.base_sha }}
        run: python3 "$GITHUB_WORKSPACE/workflow/scripts/update_golden.py" publish "$ARTIFACT_DIR"

      - name: Remove label and report result
        if: always()
        uses: actions/github-script@v7
        env:
          SUCCEEDED: ${{ needs.generate.result == 'success' && steps.push.outcome == 'success' }}
          PUSHED: ${{ steps.push.outputs.pushed }}
        with:
          script: |
            const issue = { ...context.repo, issue_number: context.payload.pull_request.number };
            const marker = '<!-- golden-test-result -->';
            const runURL = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const succeeded = process.env.SUCCEEDED === 'true';
            let result;
            if (!succeeded) {
              result = '## Golden file update failed\n\n' +
                'Check the workflow run for authorization, merge conflicts, test failures, or a moved branch. ' +
                'Resolve any conflicts outside the generated goldens by hand, then re-add `update-golden` to retry.';
            } else if (process.env.PUSHED === 'true') {
              result = '## Golden files updated\n\n' +
                'CI merged the base branch, regenerated the golden files, and pushed the result. ' +
                'The Go tests and data validation passed before publishing.';
            } else {
              result = '## Golden files already current\n\n' +
                'The branch was up to date and regeneration produced no changes. Nothing was pushed.';
            }
            const body = `${result}\n\n[Workflow run](${runURL})\n\n${marker}`;
            try {
              await github.rest.issues.removeLabel({ ...issue, name: 'update-golden' });
            } catch (error) {
              if (error.status !== 404) core.warning(`Could not remove label: ${error.message}`);
            }
            const comments = await github.paginate(github.rest.issues.listComments, issue);
            const existing = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...issue, body });
            }
            if (!succeeded) core.setFailed('Golden update failed; see the workflow run for details.');
