name: Mutation review

# Mutation is an investigation tool; routine PRs use the Rust suites and full composition snapshot.
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to inspect for missing assertions
        type: choice
        required: true
        default: calendar
        options:
          - liturgy
          - calendar
          - office
          - corpus

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}-${{ inputs.package }}
  cancel-in-progress: true

jobs:
  mutation:
    name: Review ${{ inputs.package }} mutants
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0

      - name: Run mutation review
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          set -o pipefail
          mkdir -p output/mutation
          # Validate before using input as a package path. One worker limits
          # simultaneous runaway mutants and contention on the hosted runner.
          case "$PACKAGE" in liturgy|calendar|office|corpus) ;; *) exit 2 ;; esac
          timeout --signal=TERM --kill-after=15s 20m \
            cargo mutants --package "$PACKAGE" --jobs 1 --timeout 60 \
            --gitignore true --output output/mutation \
            2>&1 | tee output/mutation/run.log

      - name: Summarize review
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ job.status }}
        run: |
          {
            echo '## Mutation review'
            echo
            echo "Run status: $OUTCOME. See the mutation-review artifact for the log and any completed JSON report."
            echo 'Incomplete runs provide no mutation score. Inspect survivors and timeouts before drawing conclusions about assertion quality.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mutation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mutation-review
          path: output/mutation/
          retention-days: 14
