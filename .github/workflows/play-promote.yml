name: Promote to Closed testing

# Each Monday, gives closed testers the build the maintainers have been running: the newest
# release on Internal testing (where every merge lands, see play.yml) is promoted to Closed
# testing, which sends it to Google's review and then to testers. A week with nothing new
# changes nothing. A manual run from the Actions tab promotes at once, or with dry_run only
# says what it would promote.
on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only say what would be promoted"
        type: boolean
        default: false

concurrency:
  group: play-promote
  cancel-in-progress: false

jobs:
  promote:
    name: Promote Internal testing to Closed testing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install the Google API client
        run: python -m pip install --quiet google-auth requests

      - name: Promote
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python apps/android/tools/play-promote.py $DRY_RUN
