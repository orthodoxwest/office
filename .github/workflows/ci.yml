name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Superseded PR revisions should not keep consuming runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .web-tools/package-lock.json

      - name: Install JavaScript lint dependencies
        run: npm ci --prefix .web-tools

      - name: Lint JavaScript
        run: make lint-js

      - name: Test golden updater
        run: python3 scripts/test_update_golden_workflow.py

  rust:
    name: Rust
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy
          # Core crates must also build for the mobile apps.
          targets: aarch64-apple-ios, aarch64-linux-android

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format, lint, and test
        run: make rust-check

      - name: Python tools
        run: |
          python3 scripts/test_ordo_compare.py
          python3 scripts/test_project_status.py
          python3 scripts/test_static_contracts.py
          python3 scripts/test_verify_psalms.py
          make diurnal-test

      - name: Validate and lint the corpus with Rust
        run: make validate lint-texts

      - name: Cross-compile the core crates for iOS and Android
        run: |
          for target in aarch64-apple-ios aarch64-linux-android; do
            cargo build -p data-format -p calendar -p corpus -p office --target "$target"
          done

  golden:
    name: Golden tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - run: make build

      - name: Run golden tests
        id: golden
        run: python3 scripts/golden.py --check
        continue-on-error: true

      - name: Capture golden diff
        id: golden_diff
        if: steps.golden.outcome == 'failure'
        run: |
          make golden
          DIFF=$(git diff tests/fixtures/golden/)
          git checkout -- tests/fixtures/golden/
          MAX=50000
          if [ "${#DIFF}" -gt "$MAX" ]; then
            DIFF="${DIFF:0:$MAX}"$'\n\n... (diff truncated — too large to display in full)'
          fi
          {
            echo 'diff<<GOLDEN_EOF'
            printf '%s\n' "$DIFF"
            echo 'GOLDEN_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Post or update golden failure comment
        if: steps.golden.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          GOLDEN_DIFF: ${{ steps.golden_diff.outputs.diff }}
        with:
          script: |
            const marker = '<!-- golden-test-result -->';
            const diff = process.env.GOLDEN_DIFF || '';
            const diffSection = diff.trim()
              ? '\n\n<details>\n<summary>What changed (lines starting with <code>-</code> were removed, <code>+</code> were added)</summary>\n\n```diff\n' + diff + '\n```\n</details>'
              : '';
            const body =
              '## Golden file mismatch detected\n\n' +
              'Generated review output doesn\'t match the checked-in golden files. ' +
              'This usually means a data or logic edit changed a rendered hour, the audit report, or the assurance snapshot.' +
              diffSection + '\n\n' +
              '**If this change is intentional** — add the `update-golden` label to this PR. ' +
              'GitHub Actions will merge `master`, regenerate the golden files and push the result automatically.\n\n' +
              '**If this is unexpected** — review the diff above and check the CI logs before adding the label.\n\n' +
              '_The same label also unblocks this PR when merge conflicts are confined to the ' +
              'generated golden files — those hold whole-corpus digests and counts, so the correct ' +
              'merged value has to be recomputed rather than picked from either side._\n\n' +
              marker;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

      - name: Resolve golden failure comment if tests now pass
        if: steps.golden.outcome == 'success' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- golden-test-result -->';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: `## Golden tests passing\n\nGolden files are up to date.\n\n${marker}`,
              });
            }

      - name: Fail if golden tests failed
        if: steps.golden.outcome == 'failure'
        run: exit 1

  assurance:
    name: Text provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.94.1

      - uses: Swatinem/rust-cache@v2

      - name: Check text provenance baseline
        id: assurance
        run: |
          make build
          set +e
          ./office review assurance -markdown > assurance-summary.md
          STATUS=$?
          set -e
          cat assurance-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"

      - name: Upload assurance summary
        if: always() && steps.assurance.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: assurance-summary
          path: assurance-summary.md

  ux:
    name: UX
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
    permissions:
      contents: read
      pull-requests: write
    outputs:
      run: ${{ steps.ux_changes.outputs.run }}

    steps:
      - name: Determine whether UX tests are needed
        id: ux_changes
        uses: actions/github-script@v7
        with:
          script: |
            const isIgnored = filename =>
              filename.startsWith('data/') ||
              filename.startsWith('tests/fixtures/golden/');

            let files;
            if (context.eventName === 'pull_request') {
              files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              });
              files = files.map(file => file.filename);
            } else if (context.eventName === 'push') {
              const before = context.payload.before;
              if (!before || /^0+$/.test(before)) {
                core.notice('Running UX tests because this push has no comparison base.');
                core.setOutput('run', 'true');
                return;
              }

              const comparison = await github.rest.repos.compareCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                base: before,
                head: context.sha,
                per_page: 100,
              });
              files = (comparison.data.files || []).map(file => file.filename);

              // GitHub truncates very large comparisons. Run conservatively if
              // the result may not include every changed path.
              if (files.length >= 300) {
                core.notice('Running UX tests because the changed-file list may be truncated.');
                core.setOutput('run', 'true');
                return;
              }
            } else {
              core.setOutput('run', 'true');
              return;
            }

            const run = files.length === 0 || files.some(filename => !isIgnored(filename));
            core.notice(run
              ? 'Running UX tests because the change includes application or test files.'
              : 'Skipping UX tests because only data and golden files changed.');
            core.setOutput('run', run ? 'true' : 'false');

      - uses: actions/checkout@v4
        if: steps.ux_changes.outputs.run == 'true'

      - name: Install Rust build tools
        if: steps.ux_changes.outputs.run == 'true'
        run: apt-get update && apt-get install -y --no-install-recommends build-essential curl ca-certificates

      - uses: dtolnay/rust-toolchain@1.94.1
        if: steps.ux_changes.outputs.run == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.ux_changes.outputs.run == 'true'

      - name: Build the Rust server
        if: steps.ux_changes.outputs.run == 'true'
        run: make build

      - name: Set up Node
        if: steps.ux_changes.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .web-tools/package-lock.json

      - name: Install UX test dependencies
        if: steps.ux_changes.outputs.run == 'true'
        run: npm ci --prefix .web-tools

      - name: Run UX behavior and accessibility tests
        env:
          PLAYWRIGHT_SUITE: behavior
        if: steps.ux_changes.outputs.run == 'true'
        run: npm --prefix .web-tools run test:ux -- tests/ux.spec.js --workers=2

      - name: Run UX visual regression tests
        env:
          PLAYWRIGHT_SUITE: visual
        if: steps.ux_changes.outputs.run == 'true'
        id: visual
        run: npm --prefix .web-tools run test:ux -- tests/visual.spec.js
        continue-on-error: true

      - name: Upload UX test report
        if: ${{ !cancelled() && steps.ux_changes.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: output/playwright/
          retention-days: 14

      - name: Post or update visual mismatch comment
        if: >-
          steps.visual.outcome == 'failure' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- ux-snapshot-result -->';
            const runURL = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body =
              '## UX snapshot mismatch detected\n\n' +
              'The browser behavior and accessibility tests passed, but one or more visual snapshots changed. ' +
              `Review the expected, actual, and diff images in the [Playwright report artifact](${runURL}).\n\n` +
              '**If this change is intentional** — add the `update-ux-snapshots` label to this PR. ' +
              'GitHub Actions will regenerate the snapshots in the pinned browser container and push them to this branch.\n\n' +
              '**If this is unexpected** — inspect the visual diff and fix the UI before applying the label.\n\n' +
              marker;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

      - name: Resolve visual mismatch comment
        if: >-
          steps.visual.outcome == 'success' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- ux-snapshot-result -->';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: `## UX snapshots passing\n\nVisual baselines are up to date.\n\n${marker}`,
              });
            }

      - name: Fail if visual snapshots differ
        if: steps.visual.outcome == 'failure'
        run: exit 1

      - name: Record skipped UX suite
        if: steps.ux_changes.outputs.run == 'false'
        run: echo "Playwright skipped because only data and golden files changed." >> "$GITHUB_STEP_SUMMARY"

  container:
    name: Rust runtime image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build -t office-smoke .
      - name: Validate the packaged corpus and serve pages with usage enabled
        run: |
          docker run --rm office-smoke /app/run-app validate
          docker run -d --name office-smoke -p 18080:8080 -e OFFICE_USAGE_DB=/tmp/usage.sqlite office-smoke
          trap 'docker logs office-smoke; docker rm -f office-smoke' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/sw.js > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/lauds/2026-03-11 > /dev/null
          curl --fail --silent 'http://127.0.0.1:18080/office.ics?lauds=06:45&tz=America/New_York' | grep 'BEGIN:VCALENDAR'
          curl --fail --silent http://127.0.0.1:18080/admin/usage > /dev/null
