name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Go build and module cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/go/bin
          key: go-${{ runner.os }}-${{ hashFiles('go.mod') }}-staticcheck-v0.7.0
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.mod') }}-

      - name: Install staticcheck
        run: |
          if ! ~/go/bin/staticcheck -version 2>/dev/null | grep -q v0.7.0; then
            go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .web-tools/package-lock.json

      - name: Install JavaScript lint dependencies
        run: npm ci --prefix .web-tools

      - name: Lint and vet
        run: make fmt-check vet lint lint-js

      - name: Run unit tests
        run: go test -count=1 $(go list ./... | grep -v '/e2e$')

      - name: Run golden tests
        id: golden
        run: go test ./internal/e2e/ -count=1
        continue-on-error: true

      - name: Capture golden diff
        id: golden_diff
        if: steps.golden.outcome == 'failure'
        run: |
          make golden
          DIFF=$(git diff internal/e2e/testdata/golden/)
          git checkout -- internal/e2e/testdata/golden/
          MAX=50000
          if [ "${#DIFF}" -gt "$MAX" ]; then
            DIFF="${DIFF:0:$MAX}"$'\n\n... (diff truncated — too large to display in full)'
          fi
          {
            echo 'diff<<GOLDEN_EOF'
            printf '%s\n' "$DIFF"
            echo 'GOLDEN_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Post or update golden failure comment
        if: steps.golden.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          GOLDEN_DIFF: ${{ steps.golden_diff.outputs.diff }}
        with:
          script: |
            const marker = '<!-- golden-test-result -->';
            const diff = process.env.GOLDEN_DIFF || '';
            const diffSection = diff.trim()
              ? '\n\n<details>\n<summary>What changed (lines starting with <code>-</code> were removed, <code>+</code> were added)</summary>\n\n```diff\n' + diff + '\n```\n</details>'
              : '';
            const body =
              '## Golden file mismatch detected\n\n' +
              'Generated review output doesn\'t match the checked-in golden files. ' +
              'This usually means a data or logic edit changed a rendered hour, the audit report, or the assurance snapshot.' +
              diffSection + '\n\n' +
              '**If this change is intentional** — add the `update-golden` label to this PR. ' +
              'GitHub Actions will regenerate the golden files and push the result automatically.\n\n' +
              '**If this is unexpected** — review the diff above and check the CI logs before adding the label.\n\n' +
              marker;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

      - name: Resolve golden failure comment if tests now pass
        if: steps.golden.outcome == 'success' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- golden-test-result -->';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: `## Golden tests passing\n\nGolden files are up to date.\n\n${marker}`,
              });
            }

      - name: Fail if golden tests failed
        if: steps.golden.outcome == 'failure'
        run: exit 1

      - name: Run assurance gates
        id: assurance
        if: steps.golden.outcome == 'success'
        run: |
          go build -o office ./cmd/server
          set +e
          ./office review assurance -markdown > assurance-summary.md
          STATUS=$?
          set -e
          cat assurance-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"

      - name: Upload assurance summary
        if: always() && steps.assurance.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: assurance-summary
          path: assurance-summary.md

  ux:
    name: UX
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Determine whether UX tests are needed
        id: ux_changes
        uses: actions/github-script@v7
        with:
          script: |
            const isIgnored = filename =>
              filename.startsWith('data/') ||
              filename.startsWith('internal/e2e/testdata/golden/');

            let files;
            if (context.eventName === 'pull_request') {
              files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              });
              files = files.map(file => file.filename);
            } else if (context.eventName === 'push') {
              const before = context.payload.before;
              if (!before || /^0+$/.test(before)) {
                core.notice('Running UX tests because this push has no comparison base.');
                core.setOutput('run', 'true');
                return;
              }

              const comparison = await github.rest.repos.compareCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                base: before,
                head: context.sha,
                per_page: 100,
              });
              files = (comparison.data.files || []).map(file => file.filename);

              // GitHub truncates very large comparisons. Run conservatively if
              // the result may not include every changed path.
              if (files.length >= 300) {
                core.notice('Running UX tests because the changed-file list may be truncated.');
                core.setOutput('run', 'true');
                return;
              }
            } else {
              core.setOutput('run', 'true');
              return;
            }

            const run = files.length === 0 || files.some(filename => !isIgnored(filename));
            core.notice(run
              ? 'Running UX tests because the change includes application or test files.'
              : 'Skipping UX tests because only data and Go golden files changed.');
            core.setOutput('run', run ? 'true' : 'false');

      - uses: actions/checkout@v4
        if: steps.ux_changes.outputs.run == 'true'

      - name: Set up Go
        if: steps.ux_changes.outputs.run == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node
        if: steps.ux_changes.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .web-tools/package-lock.json

      - name: Install UX test dependencies
        if: steps.ux_changes.outputs.run == 'true'
        run: npm ci --prefix .web-tools

      - name: Run UX behavior and accessibility tests
        if: steps.ux_changes.outputs.run == 'true'
        run: npm --prefix .web-tools run test:ux -- tests/ux.spec.js

      - name: Run UX visual regression tests
        if: steps.ux_changes.outputs.run == 'true'
        id: visual
        run: npm --prefix .web-tools run test:ux -- tests/visual.spec.js
        continue-on-error: true

      - name: Upload UX test report
        if: ${{ !cancelled() && steps.ux_changes.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: output/playwright/
          retention-days: 14

      - name: Post or update visual mismatch comment
        if: >-
          steps.visual.outcome == 'failure' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- ux-snapshot-result -->';
            const runURL = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body =
              '## UX snapshot mismatch detected\n\n' +
              'The browser behavior and accessibility tests passed, but one or more visual snapshots changed. ' +
              `Review the expected, actual, and diff images in the [Playwright report artifact](${runURL}).\n\n` +
              '**If this change is intentional** — add the `update-ux-snapshots` label to this PR. ' +
              'GitHub Actions will regenerate the snapshots in the pinned browser container and push them to this branch.\n\n' +
              '**If this is unexpected** — inspect the visual diff and fix the UI before applying the label.\n\n' +
              marker;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

      - name: Resolve visual mismatch comment
        if: >-
          steps.visual.outcome == 'success' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- ux-snapshot-result -->';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: `## UX snapshots passing\n\nVisual baselines are up to date.\n\n${marker}`,
              });
            }

      - name: Fail if visual snapshots differ
        if: steps.visual.outcome == 'failure'
        run: exit 1

      - name: Record skipped UX suite
        if: steps.ux_changes.outputs.run == 'false'
        run: echo "Playwright skipped because only data and Go golden files changed." >> "$GITHUB_STEP_SUMMARY"

  mutation-ratchet:
    name: Mutation ratchet (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package:
          - models
          - calendar
          - office

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Go build and module cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/go/bin
          key: go-${{ runner.os }}-${{ hashFiles('go.mod') }}-gremlins-v0.6.0
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.mod') }}-

      - name: Enforce mutation ratchet
        run: make mutate-ratchet MUTATE_RATCHET=${{ matrix.package }}

  mutation:
    name: Mutation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Mutants that alter loop counters can spin until their per-mutant timeout,
    # which is derived from the baseline test run and can reach several minutes
    # in --diff mode. Bound the job so a pathological PR can't burn the 6-hour
    # default; without this, a timed-out job would fail the workflow and break
    # the reporting-only contract.
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write

    steps:
      # --diff needs the base commit present locally, so fetch full history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Go build and module cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/go/bin
          key: go-${{ runner.os }}-${{ hashFiles('go.mod') }}-gremlins-v0.6.0
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.mod') }}-

      - name: Install gremlins
        continue-on-error: true
        run: make install-gremlins

      # Reporting only: thresholds are 0 in .gremlins.yaml, so this step is not
      # a gate. It surfaces mutants that survive on lines this PR touches.
      #
      # `shell: bash` is required, not cosmetic. The default run shell is
      # `bash -e` WITHOUT pipefail, so `make ... | tee` would exit 0 even when
      # make fails, and the summary below would report "No surviving mutants"
      # for a run that never happened. `shell: bash` supplies -o pipefail.
      - name: Run mutation testing on changed lines
        id: mutate
        shell: bash
        continue-on-error: true
        run: |
          git fetch --no-tags origin '${{ github.event.pull_request.base.sha }}'
          make mutate-diff MUTATE_DIFF_BASE='${{ github.event.pull_request.base.sha }}' \
            2>&1 | tee mutation.log

      - name: Report failed mutation run
        if: steps.mutate.outcome != 'success'
        run: |
          {
            echo "## Mutation testing did not complete"
            echo
            echo "The mutation run failed, so no conclusion can be drawn about"
            echo "surviving mutants. Last output:"
            echo
            echo '```'
            tail -20 mutation.log 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize surviving mutants
        id: summary
        if: steps.mutate.outcome == 'success'
        continue-on-error: true
        run: |
          # gremlins prints one line per mutant; LIVED means no test failed when
          # that line's logic was altered.
          grep -E '^\s+LIVED ' mutation.log | sed 's/^[[:space:]]*//' > lived.txt || true
          COUNT=$(wc -l < lived.txt | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          {
            echo "## Mutation testing (changed lines)"
            echo
            tail -5 mutation.log | sed 's/^/    /'
            echo
            if [ "$COUNT" -gt 0 ]; then
              echo "### $COUNT surviving mutant(s)"
              echo '```'
              cat lived.txt
              echo '```'
            else
              echo "No surviving mutants on changed lines."
            fi
          } > mutation-summary.md
          cat mutation-summary.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo 'body<<MUTATION_EOF'
            cat mutation-summary.md
            echo 'MUTATION_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-results
          path: |
            mutation.log
            mutation-summary.md

      # An unset count means the summary step failed or was skipped; '' != '0'
      # would otherwise post a comment with no findings in it. Fork PRs get a
      # read-only token and the API call 403s, so this must not fail the job.
      - name: Post or update mutation comment
        if: steps.summary.outputs.count != '' && steps.summary.outputs.count != '0'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          MUTATION_BODY: ${{ steps.summary.outputs.body }}
        with:
          script: |
            const marker = '<!-- mutation-test-result -->';
            const body =
              process.env.MUTATION_BODY +
              '\n\nA surviving mutant means this line\'s logic can be changed without ' +
              'failing any test. Some are equivalent mutants that cannot be killed — ' +
              'see `MUTATION-TESTING.md`. This check never fails the build.\n\n' +
              marker;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }
