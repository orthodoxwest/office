name: Rust parity (full window)

# PR CI compares a sample of dates hour by hour; this compares the whole
# 2026-2053 window by digesting the Rust dump and diffing it with the parity
# golden (RUST-PORT.md, "Phases").
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    name: Rust parity snapshot 2026-2053
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.94.1

      - uses: Swatinem/rust-cache@v2

      - name: Compare the full window
        run: make rust-parity-full
