name: Update UX snapshots

on:
  # This event loads the workflow definition from the default branch. The job
  # that executes pull-request code must remain read-only.
  pull_request_target:
    types: [labeled]

concurrency:
  group: update-ux-snapshots-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize snapshot update
    if: >-
      github.event.label.name == 'update-ux-snapshots' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      candidates_run: ${{ steps.candidates.outputs.run_id }}

    steps:
      - name: Require a trusted label actor
        uses: actions/github-script@v9
        with:
          script: |
            if (context.actor === 'github-actions[bot]') {
              core.setFailed('Workflow tokens cannot authorize snapshot updates.');
              return;
            }

            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });
            const trusted = new Set(['admin', 'maintain', 'write']);
            if (!trusted.has(data.permission)) {
              core.setFailed(
                `@${context.actor} has ${data.permission} permission; write access is required.`
              );
              return;
            }
            core.notice(`Snapshot update authorized by @${context.actor}.`);

      # CI uploads candidates when the visual suite fails on a PR. Reusing
      # them skips a rebuild and rerun; they get the same validation below.
      - name: Find CI snapshot candidates for this head
        id: candidates
        uses: actions/github-script@v9
        with:
          script: |
            const head = context.payload.pull_request.head.sha;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              event: 'pull_request',
              head_sha: head,
              per_page: 20,
            });
            const runs = data.workflow_runs.filter(run =>
              run.head_sha === head &&
              run.head_repository?.full_name === `${context.repo.owner}/${context.repo.repo}`
            );
            for (const run of runs) {
              const { data: listing } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                name: 'ux-snapshot-candidates',
              });
              if (listing.artifacts.some(artifact => !artifact.expired)) {
                core.notice(`Using snapshot candidates from CI run ${run.html_url}.`);
                core.setOutput('run_id', String(run.id));
                return;
              }
            }
            core.notice('No CI snapshot candidates for this head; regenerating them.');

  generate:
    name: Generate snapshots without write access
    needs: authorize
    if: >-
      needs.authorize.result == 'success' &&
      needs.authorize.outputs.candidates_run == '' &&
      github.event.label.name == 'update-ux-snapshots' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install Rust build tools
        run: apt-get update && apt-get install -y --no-install-recommends build-essential curl ca-certificates

      - uses: dtolnay/rust-toolchain@1.94.1

      - uses: Swatinem/rust-cache@v2

      - name: Build Rust server
        run: make build

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .web-tools/package-lock.json

      - name: Install UX test dependencies
        run: npm ci --prefix .web-tools

      - name: Regenerate UX snapshots
        run: npm --prefix .web-tools run test:ux -- tests/visual.spec.js --workers=2 --update-snapshots=all

      - name: Upload untrusted snapshot candidates
        uses: actions/upload-artifact@v7
        with:
          name: ux-snapshot-candidates
          path: .web-tools/tests/visual.spec.js-snapshots/
          if-no-files-found: error
          retention-days: 1

  commit:
    name: Validate and commit snapshots
    needs: [authorize, generate]
    if: >-
      always() &&
      needs.authorize.result == 'success' &&
      (needs.generate.result == 'success' ||
        (needs.generate.result == 'skipped' && needs.authorize.outputs.candidates_run != ''))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download untrusted snapshot candidates from CI
        if: needs.authorize.outputs.candidates_run != ''
        uses: actions/download-artifact@v8
        with:
          name: ux-snapshot-candidates
          path: ${{ runner.temp }}/ux-snapshot-candidates
          run-id: ${{ needs.authorize.outputs.candidates_run }}
          github-token: ${{ github.token }}

      - name: Download untrusted regenerated snapshot candidates
        if: needs.authorize.outputs.candidates_run == ''
        uses: actions/download-artifact@v8
        with:
          name: ux-snapshot-candidates
          path: ${{ runner.temp }}/ux-snapshot-candidates

      - name: Validate and stage snapshot candidates
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/ux-snapshot-candidates
        run: |
          set -euo pipefail
          SNAPSHOT_DIR=.web-tools/tests/visual.spec.js-snapshots

          if [ -L "$SNAPSHOT_DIR" ] || [ ! -d "$SNAPSHOT_DIR" ]; then
            echo "::error::$SNAPSHOT_DIR must be a real directory."
            exit 1
          fi

          UNEXPECTED=$(find "$ARTIFACT_DIR" -mindepth 1 \
            \( ! -type f -o ! -name '*.png' \) -print -quit)
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::Snapshot artifact contains an unexpected entry: $UNEXPECTED"
            exit 1
          fi

          mapfile -t CANDIDATES < <(
            find "$ARTIFACT_DIR" -mindepth 1 -maxdepth 1 -type f \
              -name '*.png' -print | LC_ALL=C sort
          )
          if [ "${#CANDIDATES[@]}" -lt 1 ] || [ "${#CANDIDATES[@]}" -gt 50 ]; then
            echo "::error::Expected between 1 and 50 snapshot PNGs; found ${#CANDIDATES[@]}."
            exit 1
          fi

          for CANDIDATE in "${CANDIDATES[@]}"; do
            SIZE=$(stat -c '%s' "$CANDIDATE")
            SIGNATURE=$(head -c 8 "$CANDIDATE" | od -An -tx1 | tr -d ' \n')
            if [ "$SIZE" -gt 5242880 ] || [ "$SIGNATURE" != '89504e470d0a1a0a' ]; then
              echo "::error::Invalid snapshot candidate: $CANDIDATE"
              exit 1
            fi
          done

          UNEXPECTED=$(find "$SNAPSHOT_DIR" -mindepth 1 -maxdepth 1 \
            \( ! -type f -o ! -name '*.png' \) -print -quit)
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::Snapshot directory contains an unexpected entry: $UNEXPECTED"
            exit 1
          fi

          find "$SNAPSHOT_DIR" -maxdepth 1 -type f -name '*.png' -delete
          for CANDIDATE in "${CANDIDATES[@]}"; do
            cp -- "$CANDIDATE" "$SNAPSHOT_DIR/$(basename "$CANDIDATE")"
          done

          git reset --quiet HEAD --
          git add -f -- "$SNAPSHOT_DIR"

          while IFS= read -r -d '' STAGED_PATH; do
            case "$STAGED_PATH" in
              "$SNAPSHOT_DIR"/*.png) ;;
              *)
                echo "::error::Refusing to commit unexpected path: $STAGED_PATH"
                exit 1
                ;;
            esac
          done < <(git diff --cached --name-only -z)

      - name: Commit and push
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && echo "No UX snapshot changes needed." || \
            git commit --no-verify -m "test: regenerate Playwright snapshots"
          git push origin "HEAD:refs/heads/$HEAD_REF"

  report:
    name: Report snapshot update
    needs: [authorize, generate, commit]
    if: >-
      always() &&
      github.event.label.name == 'update-ux-snapshots' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Remove label
        uses: actions/github-script@v9
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: 'update-ux-snapshots',
              });
            } catch (_) {
              // label may have already been removed — that's fine
            }

      - name: Comment result
        uses: actions/github-script@v9
        env:
          UPDATE_SUCCEEDED: ${{ needs.commit.result == 'success' }}
        with:
          script: |
            const marker = '<!-- ux-snapshot-update -->';
            const runURL = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const succeeded = process.env.UPDATE_SUCCEEDED === 'true';
            const body = succeeded
              ? `## UX snapshots updated\n\nCI regenerated and validated the visual baselines, then pushed them to this branch.\n\n${marker}`
              : `## UX snapshot update failed\n\nThe visual baselines were not updated. Check the [workflow run](${runURL}) for details.\n\n${marker}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }
