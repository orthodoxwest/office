name: iOS

# Builds the iOS app for the simulator on macOS, runs its tests there, and renders review
# screenshots of the app at fixed dates. The screenshots and the build log are uploaded as an
# artifact and also force-pushed to the branch ci/ios-screenshots/<branch>, one commit holding
# the latest run's files, so they can be read with git where artifact downloads are not reachable.
#
# A pull request's paths filter looks at the whole pull request, so every push to one that ever
# touched the app would run the whole job again. The `changes` job skips the build when the push
# changed nothing the app is built from and the job passed on the commit before it.
on:
  push:
    branches: [master]
    paths:
      - "apps/ios/**"
      - "!apps/ios/README.md"
      - "apps/mobile-ffi/**"
      - "crates/**"
      - "apps/android/app/src/main/res/font/**"
      - "apps/android/app/src/main/res/drawable-nodpi/**"
      - "data/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ios.yml"
  pull_request:
    branches: [master]
    paths:
      - "apps/ios/**"
      - "!apps/ios/README.md"
      - "apps/mobile-ffi/**"
      - "crates/render-blocks/**"
      # The faces and plaster the iOS app shares with the Android app.
      - "apps/android/app/src/main/res/font/**"
      - "apps/android/app/src/main/res/drawable-nodpi/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  # A newer push carries everything an older one did, so only the newest run matters.
  cancel-in-progress: true

jobs:
  changes:
    name: Decide whether the app needs building
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Compare the push with the last passing commit
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha }}
          # The pull_request paths above, as patterns on a changed file's path.
          APP_PATHS: >-
            ^apps/ios/|^apps/mobile-ffi/|^crates/render-blocks/|^apps/android/app/src/main/res/font/|^apps/android/app/src/main/res/drawable-nodpi/|^\.github/workflows/ios\.yml$
        run: |
          build() { echo "$1"; echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; }
          # Only a new push to an open pull request can be skipped; master and manual runs always build.
          [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$ACTION" = synchronize ] || build "Building: $GITHUB_EVENT_NAME ${ACTION}."
          # The previous head must have passed (built, or itself skipped on a passing parent).
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ios.yml/runs?head_sha=$BEFORE&status=success" --jq .total_count) \
            || build "Building: could not look up the run for ${BEFORE::7}."
          [ "$passed" -gt 0 ] || build "Building: the job has not passed on ${BEFORE::7}."
          # What this push changed (after a force-push, everything since the merge base).
          files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$AFTER" --jq '.files[].filename') \
            || build "Building: could not compare ${BEFORE::7}...${AFTER::7}."
          count=$(printf '%s\n' "$files" | grep -c . || true)
          [ "$count" -lt 300 ] || build "Building: the comparison lists $count files, more than it can show."
          app=$(printf '%s\n' "$files" | grep -E "$APP_PATHS" | grep -vx 'apps/ios/README.md' || true)
          [ -z "$app" ] || build "Building: this push changed $(echo "$app" | tr '\n' ' ')"
          echo "Skipping: ${BEFORE::7}...${AFTER::7} changed nothing the app is built from, and the job passed on ${BEFORE::7}."
          echo "build=false" >> "$GITHUB_OUTPUT"

  build:
    name: Build, test and screenshot (simulator)
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: macos-15
    permissions:
      # The screenshots branch.
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Choose and boot the simulators
        id: sim
        run: |
          # The newest runtime's iPhone 16 and an 11-inch iPad, else its first of each.
          xcrun simctl list devices available -j > devices.json
          pick() {
            python3 - "$1" "$2" <<'PY'
          import json, sys
          family, preferred = sys.argv[1], sys.argv[2]
          devices = json.load(open("devices.json"))["devices"]
          ios = sorted((k for k in devices if "iOS" in k), key=lambda k: [int(x) for x in k.rsplit("iOS-", 1)[1].split("-")])
          found = [d for d in devices[ios[-1]] if d["name"].startswith(family)]
          exact = [d for d in found if d["name"] == preferred]
          print((exact or [d for d in found if d["name"].startswith(preferred)] or found)[0]["udid"])
          PY
          }
          phone=$(pick iPhone 'iPhone 16') ipad=$(pick iPad 'iPad Pro 11')
          echo "udid=$phone" >> "$GITHUB_OUTPUT"
          echo "ipad=$ipad" >> "$GITHUB_OUTPUT"
          # A simulator's first boot takes minutes, so both start now, behind the builds, and the
          # screenshots wait for them (simctl bootstatus).
          for sim in "$phone" "$ipad"; do
            nohup xcrun simctl boot "$sim" > "$RUNNER_TEMP/boot-$sim.log" 2>&1 &
          done

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build the Rust core and its Swift bindings
        run: apps/ios/build-core.sh

      - name: Generate the Xcode project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Build and test
        working-directory: apps/ios
        run: |
          # The whole log goes with the screenshots; the job log shows what failed.
          mkdir -p build/review
          if ! xcodebuild test -project Office.xcodeproj -scheme Office \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/dd > build/review/xcodebuild.log 2>&1; then
            grep -E "error:|: error|FAILED|failed|Undefined symbol" build/review/xcodebuild.log | head -n 120
            tail -n 40 build/review/xcodebuild.log
            exit 1
          fi
          grep -E "Test Case .*(passed|failed)|Executed [0-9]+ test" build/review/xcodebuild.log | tail -n 20

      - name: Render screenshots
        working-directory: apps/ios
        run: |
          app=build/dd/Build/Products/Debug-iphonesimulator/Office.app
          id=org.orthodoxwest.office.preview
          # Each page at a fixed day (DATE, else 15 March 2026), with today pinned to it.
          shoot() {
            sim=$1 name=$2
            shift 2
            day=${DATE:-2026-03-15}
            xcrun simctl launch --terminate-running-process "$sim" "$id" -today "$day" -date "$day" "$@" > /dev/null
            sleep 7
            xcrun simctl io "$sim" screenshot "build/review/$name.png" > /dev/null
          }
          for sim in ${{ steps.sim.outputs.udid }} ${{ steps.sim.outputs.ipad }}; do
            echo "$(date +%T) waiting for $sim to boot"
            xcrun simctl bootstatus "$sim" -b > /dev/null
            echo "$(date +%T) booted"
            xcrun simctl ui "$sim" appearance light
            xcrun simctl status_bar "$sim" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4
            xcrun simctl install "$sim" "$app"
          done
          phone=${{ steps.sim.outputs.udid }}
          for theme in nave apse; do
            shoot "$phone" "home-$theme" -page home -theme "$theme"
            for hour in lauds vespers compline; do
              shoot "$phone" "$hour-$theme" -page hour -hour "$hour" -theme "$theme"
            done
            shoot "$phone" "psalm-$theme" -page hour -hour vespers -anchor psalm -theme "$theme"
            shoot "$phone" "hymn-$theme" -page hour -hour vespers -anchor hymn -theme "$theme"
            shoot "$phone" "ordo-$theme" -page ordo -theme "$theme"
            shoot "$phone" "year-$theme" -page year -theme "$theme"
            shoot "$phone" "reminders-$theme" -page reminders -theme "$theme"
          done
          # Eastertide's warmer gilding.
          DATE=2026-04-12 shoot "$phone" "easter-nave" -page hour -hour lauds -theme nave
          # A first-class day's hour in its frame.
          for theme in nave apse; do
            DATE=2026-12-25 shoot "$phone" "christmas-$theme" -page hour -hour lauds -theme "$theme"
          done
          # The desktop composition on an iPad.
          ipad=${{ steps.sim.outputs.ipad }}
          for theme in nave apse; do
            shoot "$ipad" "ipad-home-$theme" -page home -theme "$theme"
            shoot "$ipad" "ipad-vespers-$theme" -page hour -hour vespers -theme "$theme"
            shoot "$ipad" "ipad-ordo-$theme" -page ordo -theme "$theme"
          done
          shoot "$ipad" "ipad-year-nave" -page year -theme nave
          shoot "$ipad" "ipad-settings-nave" -page home -theme nave -settings YES

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-screenshots
          path: apps/ios/build/review/
          if-no-files-found: warn

      - name: Publish the screenshots to a branch
        # A fork's token cannot push; its run keeps the artifact.
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ci/ios-screenshots/${{ github.head_ref || github.ref_name }}
        run: |
          [ -d apps/ios/build/review ] || exit 0
          cd apps/ios/build/review
          git init -q -b screenshots
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -q -m "iOS screenshots for ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
