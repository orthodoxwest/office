name: iOS

# Builds the iOS app for the simulator on macOS, runs its tests there, and renders review
# screenshots of the app at fixed dates. The screenshots and the build log are uploaded as an
# artifact and also force-pushed to the branch ci/ios-screenshots/<branch>, one commit holding
# the latest run's files, so they can be read with git where artifact downloads are not reachable.
on:
  push:
    branches: [master]
    paths:
      - "apps/ios/**"
      - "apps/mobile-ffi/**"
      - "crates/**"
      - "data/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ios.yml"
  pull_request:
    branches: [master]
    paths:
      - "apps/ios/**"
      - "apps/mobile-ffi/**"
      - "crates/render-blocks/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build, test and screenshot (simulator)
    runs-on: macos-15
    permissions:
      # The screenshots branch.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build the Rust core and its Swift bindings
        run: apps/ios/build-core.sh

      - name: Generate the Xcode project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Choose a simulator
        id: sim
        run: |
          # The newest runtime's iPhone 16, else its first iPhone.
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devices if "iOS" in k), key=lambda k: [int(x) for x in k.rsplit("iOS-", 1)[1].split("-")])
          phones = [d for d in devices[ios[-1]] if d["name"].startswith("iPhone")]
          pick = next((d for d in phones if d["name"] == "iPhone 16"), phones[0])
          print(pick["udid"])
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build and test
        working-directory: apps/ios
        run: |
          # The whole log goes with the screenshots; the job log shows what failed.
          mkdir -p build/review
          if ! xcodebuild test -project Office.xcodeproj -scheme Office \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/dd > build/review/xcodebuild.log 2>&1; then
            grep -E "error:|: error|FAILED|failed|Undefined symbol" build/review/xcodebuild.log | head -n 120
            tail -n 40 build/review/xcodebuild.log
            exit 1
          fi
          grep -E "Test Case .*(passed|failed)|Executed [0-9]+ test" build/review/xcodebuild.log | tail -n 20

      - name: Render screenshots
        working-directory: apps/ios
        run: |
          sim=${{ steps.sim.outputs.udid }}
          xcrun simctl boot "$sim" 2>/dev/null || true
          xcrun simctl bootstatus "$sim" -b
          xcrun simctl ui "$sim" appearance light
          xcrun simctl status_bar "$sim" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4
          xcrun simctl install "$sim" build/dd/Build/Products/Debug-iphonesimulator/Office.app
          for hour in lauds vespers compline; do
            xcrun simctl launch --terminate-running-process "$sim" org.orthodoxwest.office.preview -hour "$hour" -date 2026-03-15
            sleep 6
            xcrun simctl io "$sim" screenshot "build/review/$hour.png"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: apps/ios/build/review/
          if-no-files-found: warn

      - name: Publish the screenshots to a branch
        # A fork's token cannot push; its run keeps the artifact.
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ci/ios-screenshots/${{ github.head_ref || github.ref_name }}
        run: |
          [ -d apps/ios/build/review ] || exit 0
          cd apps/ios/build/review
          git init -q -b screenshots
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -q -m "iOS screenshots for ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
