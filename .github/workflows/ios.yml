name: iOS

# Builds the iOS app for the simulator on macOS, runs its tests there, and renders review
# screenshots of the app at fixed dates (apps/ios/screenshots.sh). The screenshots and the build
# log are uploaded as an artifact and also force-pushed to the branch ci/ios-screenshots/<branch>,
# one commit holding the latest run's files, so they can be read with git where artifact
# downloads are not reachable.
#
# The screenshots are compared with the baselines checked in at apps/ios/snapshots/
# (scripts/ios-snapshots.py has the tolerance). A pull request whose shots changed fails, with
# each changed shot beside its baseline in the ios-snapshot-diffs artifact; the
# update-ios-snapshots label checks this run's shots in (update-ios-snapshots.yml). On master a
# change is only a warning: a data change can move a page without running this job on its pull
# request, and master cannot take the label.
#
# A pull request's paths filter looks at the whole pull request, so every push to one that ever
# touched the app would run the whole job again. The `changes` job skips the build when the push
# changed nothing the app is built from and the job passed on the commit before it.
on:
  push:
    branches: [master]
    paths:
      - "apps/ios/**"
      - "!apps/ios/README.md"
      - "apps/mobile-ffi/**"
      - "scripts/ios-snapshots.py"
      - "scripts/test_ios_snapshots.py"
      - "crates/**"
      - "apps/android/app/src/main/res/font/**"
      - "apps/android/app/src/main/res/drawable-nodpi/**"
      - "data/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ios.yml"
  pull_request:
    branches: [master]
    paths:
      - "apps/ios/**"
      - "!apps/ios/README.md"
      - "apps/mobile-ffi/**"
      - "scripts/ios-snapshots.py"
      - "scripts/test_ios_snapshots.py"
      - "crates/render-blocks/**"
      # The faces and plaster the iOS app shares with the Android app.
      - "apps/android/app/src/main/res/font/**"
      - "apps/android/app/src/main/res/drawable-nodpi/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      store:
        description: "Shoot at the App Store's sizes (6.9-inch iPhone, 13-inch iPad)"
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  # A newer push carries everything an older one did, so only the newest run matters.
  cancel-in-progress: true

jobs:
  changes:
    name: Decide whether the app needs building
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Compare the push with the last passing commit
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha }}
          # The pull_request paths above, as patterns on a changed file's path.
          APP_PATHS: >-
            ^apps/ios/|^apps/mobile-ffi/|^scripts/(test_)?ios[-_]snapshots\.py$|^crates/render-blocks/|^apps/android/app/src/main/res/font/|^apps/android/app/src/main/res/drawable-nodpi/|^\.github/workflows/ios\.yml$
        run: |
          build() { echo "$1"; echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; }
          # Only a new push to an open pull request can be skipped; master and manual runs always build.
          [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$ACTION" = synchronize ] || build "Building: $GITHUB_EVENT_NAME ${ACTION}."
          # The previous head must have passed (built, or itself skipped on a passing parent).
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ios.yml/runs?head_sha=$BEFORE&status=success" --jq .total_count) \
            || build "Building: could not look up the run for ${BEFORE::7}."
          [ "$passed" -gt 0 ] || build "Building: the job has not passed on ${BEFORE::7}."
          # What this push changed (after a force-push, everything since the merge base).
          files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$AFTER" --jq '.files[].filename') \
            || build "Building: could not compare ${BEFORE::7}...${AFTER::7}."
          count=$(printf '%s\n' "$files" | grep -c . || true)
          [ "$count" -lt 300 ] || build "Building: the comparison lists $count files, more than it can show."
          app=$(printf '%s\n' "$files" | grep -E "$APP_PATHS" | grep -vx 'apps/ios/README.md' || true)
          [ -z "$app" ] || build "Building: this push changed $(echo "$app" | tr '\n' ' ')"
          echo "Skipping: ${BEFORE::7}...${AFTER::7} changed nothing the app is built from, and the job passed on ${BEFORE::7}."
          echo "build=false" >> "$GITHUB_OUTPUT"

  build:
    name: Build, test and screenshot (simulator)
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: macos-15
    permissions:
      # The screenshots branch.
      contents: write
      # The snapshot comparison's comment.
      pull-requests: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Choose and boot the simulators
        id: sim
        env:
          STORE: ${{ inputs.store }}
        run: |
          # The Xcode, runtime and devices the baselines were taken with (their environment.json),
          # else the image's newest iPhone 16 and 11-inch iPad Pro. A manual run with `store` takes
          # the sizes App Store Connect asks for instead. Both simulators start booting now,
          # behind the builds.
          if [ "$STORE" = true ]; then
            apps/ios/screenshots.sh devices store >> "$GITHUB_OUTPUT"
          else
            apps/ios/screenshots.sh devices >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.3

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build the Rust core and its Swift bindings
        run: apps/ios/build-core.sh

      - name: Generate the Xcode project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Build and test
        working-directory: apps/ios
        run: |
          # The whole log goes with the screenshots; the job log shows what failed.
          mkdir -p build/review
          if ! xcodebuild test -project Office.xcodeproj -scheme Office \
            -destination "id=${{ steps.sim.outputs.phone }}" \
            -derivedDataPath build/dd > build/review/xcodebuild.log 2>&1; then
            grep -E "error:|: error|FAILED|failed|Undefined symbol" build/review/xcodebuild.log | head -n 120
            tail -n 40 build/review/xcodebuild.log
            exit 1
          fi
          grep -E "Test Case .*(passed|failed)|Executed [0-9]+ test" build/review/xcodebuild.log | tail -n 20

      - name: Render screenshots
        working-directory: apps/ios
        env:
          PHONE: ${{ steps.sim.outputs.phone }}
          IPAD: ${{ steps.sim.outputs.ipad }}
        run: ./screenshots.sh shoot "$PHONE" "$IPAD" build/dd/Build/Products/Debug-iphonesimulator/Office.app build/review

      - name: Compare with the checked-in baselines
        id: compare
        if: ${{ !inputs.store }}
        run: |
          python3 -m venv "$RUNNER_TEMP/snapshots"
          "$RUNNER_TEMP/snapshots/bin/pip" install --quiet pillow==12.3.0
          "$RUNNER_TEMP/snapshots/bin/python" scripts/test_ios_snapshots.py
          set +e
          "$RUNNER_TEMP/snapshots/bin/python" scripts/ios-snapshots.py compare apps/ios/build/review apps/ios/snapshots \
            --updates apps/ios/build/review/snapshots --diffs apps/ios/build/review/snapshot-diffs \
            --summary "$GITHUB_STEP_SUMMARY"
          status=$?
          set -e
          [ "$status" -le 1 ] || exit "$status"
          echo "differ=$([ "$status" -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ios-screenshots${{ inputs.store && '-store' || '' }}
          path: apps/ios/build/review/
          if-no-files-found: warn

      # The update-ios-snapshots label commits these instead of shooting again: the set the
      # comparison would check in (unchanged baselines kept as they are). They come from the pull
      # request's code, so that workflow validates them first.
      - name: Upload snapshot candidates
        if: >-
          !inputs.store &&
          steps.compare.outcome == 'success' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ios-snapshot-candidates
          path: apps/ios/build/review/snapshots/
          if-no-files-found: error
          retention-days: 3

      - name: Upload snapshot diffs
        if: steps.compare.outputs.differ == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ios-snapshot-diffs
          path: apps/ios/build/review/snapshot-diffs/
          if-no-files-found: warn
          retention-days: 14

      - name: Post or update the snapshot comment
        if: >-
          steps.compare.outcome == 'success' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9.0.0
        env:
          DIFFER: ${{ steps.compare.outputs.differ }}
        with:
          script: |
            const marker = '<!-- ios-snapshot-result -->';
            const runURL = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const differ = process.env.DIFFER === 'true';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.includes(marker)
            );
            if (!differ) {
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: `## iOS screenshots passing\n\nThe simulator screenshots match their baselines.\n\n${marker}`,
                });
              }
              return;
            }
            const body =
              '## iOS screenshot mismatch detected\n\n' +
              'The app built and its tests passed, but one or more simulator screenshots differ from the baselines in `apps/ios/snapshots/`. ' +
              `The [run's summary](${runURL}) lists them, and its \`ios-snapshot-diffs\` artifact shows each beside its baseline.\n\n` +
              '**If this change is intentional** — add the `update-ios-snapshots` label to this PR. ' +
              'GitHub Actions will push the screenshots this run took (or take them again, if this run has none for the current head) to this branch.\n\n' +
              '**If this is unexpected** — inspect the diffs and fix the app before applying the label.\n\n' +
              marker;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

      - name: Publish the screenshots to a branch
        # A fork's token cannot push; its run keeps the artifact.
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
          # The store-size set beside the review set, not over it.
          BRANCH: ci/ios-screenshots/${{ github.head_ref || github.ref_name }}${{ inputs.store && '-store' || '' }}
        run: |
          [ -d apps/ios/build/review ] || exit 0
          cd apps/ios/build/review
          git init -q -b screenshots
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -q -m "iOS screenshots for ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"

      # Last, so the artifacts and the screenshots branch are there to look at.
      - name: Fail if the screenshots differ
        if: steps.compare.outputs.differ == 'true'
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "::error::The iOS screenshots differ from their baselines; see the summary and the ios-snapshot-diffs artifact."
            exit 1
          fi
          echo "::warning::The iOS screenshots differ from their baselines; the next pull request that touches the app can take them again with the update-ios-snapshots label."
