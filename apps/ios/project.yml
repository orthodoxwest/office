# The iOS app's Xcode project, generated by XcodeGen (`xcodegen generate` in apps/ios), so no
# .xcodeproj is checked in. Run ./build-core.sh first: the project links build/OfficeCore.xcframework
# and compiles build/generated/office_mobile.swift, the Rust core and its bindings.
name: Office
options:
  bundleIdPrefix: org.orthodoxwest
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Office:
    type: application
    platform: iOS
    sources:
      - path: Office
      - path: build/generated/office_mobile.swift
      # The web's faces, shared with the Android app.
      - path: ../android/app/src/main/res/font/eb_garamond_regular.otf
        buildPhase: resources
      - path: ../android/app/src/main/res/font/eb_garamond_italic.otf
        buildPhase: resources
      - path: ../android/app/src/main/res/font/noto_sans_symbols_cross.ttf
        buildPhase: resources
    dependencies:
      - framework: build/OfficeCore.xcframework
        embed: false
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Divine Office
        UILaunchScreen: {}
        UIAppFonts:
          - eb_garamond_regular.otf
          - eb_garamond_italic.otf
          - noto_sans_symbols_cross.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        # Beside the eventual store app, as the Android preview is.
        PRODUCT_BUNDLE_IDENTIFIER: org.orthodoxwest.office.preview
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
  OfficeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OfficeTests
    dependencies:
      - target: Office
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Office:
    build:
      targets:
        Office: all
        OfficeTests: [test]
    test:
      targets:
        - OfficeTests
