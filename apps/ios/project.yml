# The iOS app's Xcode project, generated by XcodeGen (`xcodegen generate` in apps/ios), so no
# .xcodeproj is checked in. Run ./build-core.sh first: the project links build/OfficeCore.xcframework
# and compiles build/generated/office_mobile.swift, the Rust core and its bindings.
name: Office
options:
  bundleIdPrefix: org.orthodoxwest
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Office:
    type: application
    platform: iOS
    sources:
      - path: Office
      - path: build/generated/office_mobile.swift
      # The web's faces, shared with the Android app.
      - path: ../android/app/src/main/res/font/eb_garamond_regular.otf
        buildPhase: resources
      - path: ../android/app/src/main/res/font/eb_garamond_italic.otf
        buildPhase: resources
      - path: ../android/app/src/main/res/font/noto_sans_symbols_cross.ttf
        buildPhase: resources
      # The plaster walls, baked once from the web's layers for both apps.
      - path: ../android/app/src/main/res/drawable-nodpi/plaster_nave.jpg
        buildPhase: resources
      - path: ../android/app/src/main/res/drawable-nodpi/plaster_apse.jpg
        buildPhase: resources
    dependencies:
      - framework: build/OfficeCore.xcframework
        embed: false
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Divine Office
        # XcodeGen would write 1.0 and 1; TestFlight reads these, and its workflow sets the build.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only the system's own TLS, so no export-compliance question on each upload.
        ITSAppUsesNonExemptEncryption: false
        # The Nave's ground, or the Apse's when the phone is dark.
        UILaunchScreen:
          UIColorName: LaunchBackground
        # A background refresh moves the reminders' schedule on (Reminders.swift).
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - org.orthodoxwest.office.reminders
        UIAppFonts:
          - eb_garamond_regular.otf
          - eb_garamond_italic.otf
          - noto_sans_symbols_cross.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        # The store app's: a TestFlight build is a pre-release of it, not an app beside it.
        PRODUCT_BUNDLE_IDENTIFIER: org.orthodoxwest.office
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  OfficeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OfficeTests
    dependencies:
      - target: Office
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Office:
    build:
      targets:
        Office: all
        OfficeTests: [test]
    test:
      targets:
        - OfficeTests
