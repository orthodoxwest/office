# The iOS app's Xcode project, generated by XcodeGen (`xcodegen generate` in apps/ios), so no
# .xcodeproj is checked in. Run ./build-core.sh first: the project links build/OfficeCore.xcframework
# and compiles build/generated/office_mobile.swift, the Rust core and its bindings.
name: Office
options:
  bundleIdPrefix: org.orthodoxwest
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Office:
    type: application
    platform: iOS
    sources:
      - path: Office
      - path: build/generated/office_mobile.swift
      # The web's faces, shared with the Android app.
      - path: ../android/app/src/main/res/font/eb_garamond_regular.ttf
        buildPhase: resources
      - path: ../android/app/src/main/res/font/eb_garamond_italic.ttf
        buildPhase: resources
      - path: ../android/app/src/main/res/font/noto_sans_symbols_cross.ttf
        buildPhase: resources
      # The plaster walls, baked once from the web's layers for both apps.
      - path: ../android/app/src/main/res/drawable-nodpi/plaster_nave.jpg
        buildPhase: resources
      - path: ../android/app/src/main/res/drawable-nodpi/plaster_apse.jpg
        buildPhase: resources
      # The phone home panel's plaster, from the same bake.
      - path: ../android/app/src/main/res/drawable-nodpi/panel_nave.jpg
        buildPhase: resources
      - path: ../android/app/src/main/res/drawable-nodpi/panel_apse.jpg
        buildPhase: resources
    dependencies:
      - framework: build/OfficeCore.xcframework
        embed: false
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Daily Office
        # The Nave's ground, or the Apse's when the phone is dark.
        UILaunchScreen:
          UIColorName: LaunchBackground
        # No status bar from the launch screen on, as in the app (OfficeApp.swift).
        UIStatusBarHidden: true
        # A background refresh moves the reminders' schedule on (Reminders.swift).
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - org.orthodoxwest.office.reminders
        # Whether this build reports the daily usage count (Usage.swift): Release only.
        OfficeCountsUsage: $(OFFICE_COUNTS_USAGE)
        UIAppFonts:
          - eb_garamond_regular.ttf
          - eb_garamond_italic.ttf
          - noto_sans_symbols_cross.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        # Beside the eventual store app, as the Android preview is.
        PRODUCT_BUNDLE_IDENTIFIER: org.orthodoxwest.office.preview
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # Only builds that go to readers count usage: never a Debug build, its tests, or the
      # simulator screenshots.
      configs:
        Debug:
          OFFICE_COUNTS_USAGE: "NO"
        Release:
          OFFICE_COUNTS_USAGE: "YES"
  OfficeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OfficeTests
    dependencies:
      - target: Office
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Office:
    build:
      targets:
        Office: all
        OfficeTests: [test]
    test:
      targets:
        - OfficeTests
