[package]
name = "mobile-ffi"
version = "0.1.0"
description = "The Office engine for the native apps: embedded corpus and UniFFI bindings"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "office_mobile"
# cdylib for Android's JNI loader; `lib` for the tests. iOS will add staticlib.
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
calendar.workspace = true
liturgy.workspace = true
corpus.workspace = true
office.workspace = true
presentation.workspace = true
render-blocks.workspace = true
uniffi.workspace = true

[dev-dependencies]
tools.workspace = true

# No workspace lint table: UniFFI's generated scaffolding is `unsafe` FFI glue,
# which the workspace's `unsafe_code = "forbid"` would reject. This crate's own
# code stays safe; every engine crate it wraps keeps the forbid.
[lints.clippy]
wildcard_enum_match_arm = "deny"
